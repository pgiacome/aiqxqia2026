[project]
name = "padic-kernel"
version = "0.1.0"
description = "Ultrametric quantum kernels: p-adic feature maps for hierarchical data"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "nltk>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "code"}
packages = ["padic_kernel"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["code/tests"]
addopts = "-q"
markers = ["slow: needs a downloaded corpus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
